[project]
name = "busybar-home-assistant"
version = "0.1.8"
description = "Home Assistant control surface and pixel dashboard for BUSY Bar"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Kyle Whirl" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = [
  "busylib==1.0.0",
  "homeassistant>=2026.7.0,<2026.8.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "ruff>=0.9.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]
