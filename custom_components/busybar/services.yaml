show_message:
  fields:
    text:
      required: true
      example: "Someone is at the door"
      selector:
        text:
    color:
      example: "#FFB000"
      selector:
        color_rgb:
    duration:
      default: 3
      selector:
        number:
          min: 0.5
          max: 120
          step: 0.5
          unit_of_measurement: seconds
    config_entry_id:
      selector:
        config_entry:
          integration: busybar
clear_display:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: busybar

refresh_dashboard:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: busybar
